  risi:[

    {n:"Rishiganga Bridge",dl:-0.014,dd:0.012,e:2050,p:0,t:"bridge"},

    {n:"Joshimath PHC",dl:-0.041,dd:0.021,e:1875,p:0,t:"hospital"},
    {n:"Safe Zone · Auli Ridge",dl:-0.060,dd:0.010,e:2800,p:4000,t:"safezone"}
  ]
};

/* ---------------- ENGINE ---------------- */
const SEVERITY = { small:{floodR:6000, flow:3.0, depthK:0.6, conf:78, label:"Small"}, medium:{floodR:11000, flow:5.0, depthK:1.0, conf:82, label:"Medium"}, severe:{floodR:18000, flow:8.0, depthK:1.5, conf:86, label:"Severe"} };
const DURATIONS = [6,12,24];

function haversine(a,b){
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat), dLng=toR(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

function getVillages(damId){ return (VILLAGES[damId]||[]).map(v=>({...v, lat:DAMS.find(d=>d.id===damId).lat+v.dl, lng:DAMS.find(d=>d.id===damId).lng+v.dd})); }

/* Run a simulation for a dam + scenario */
function runSimulation(damId, scenario){
  const dam = DAMS.find(d=>d.id===damId);
  const sev = SEVERITY[scenario.severity];
  const villages = getVillages(damId);
  const head = scenario.head || (dam.height||120);
  const radius = sev.floodR * (0.6 + head/400); // m
  const results = [];
  let maxDist=0;

  villages.forEach(v=>{
    const dist = haversine({lat:dam.lat,lng:dam.lng},{lat:v.lat,lng:v.lng});
    maxDist=Math.max(maxDist,dist);
    // elevation-aware: lower elevation downstream => more floodable
    const damE = dam.height ? 600 : 2200;
    const eDrop = Math.max(0,(damE - v.e));
    const elevFactor = Math.min(1.2, 0.5 + eDrop/600);
    const inFlood = dist <= radius * elevFactor && v.t!=="safezone";
    const depth = inFlood ? Math.max(0.2, sev.depthK * head/100 * (1 - dist/(radius*elevFactor)) ) : 0;
    const arrivalMin = inFlood ? (dist / (sev.flow*60)) : null; // minutes
    results.push({ ...v, dist:Math.round(dist), inFlood, depth:+depth.toFixed(1), arrivalMin: arrivalMin? +arrivalMin.toFixed(0):null, elevFactor:+elevFactor.toFixed(2) });
  });

  // flood polygon: teardrop downstream
  const dirLat = villages[0]? villages[0].dl/Math.abs(villages[0].dl||0.001) : -1;
  const dirLng = villages[0]? villages[0].dd/Math.abs(villages[0].dd||0.001) : 1;
  const poly = [];
  const steps=28;
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const ang = Math.PI*2*t;
    const r = radius/111000 * (0.55 + 0.45*Math.sin(ang*0.5+0.3)); // irregular
    const dx = Math.cos(ang)*r*0.7;
    const dy = Math.sin(ang)*r*1.25;
    poly.push([ dam.lat + dy*dirLat*-1 + 0.0, dam.lng + dx*dirLng + 0.0 ]);
  }
  // shift polygon downstream
  const shifted = poly.map(p=>[ p[0] + dirLat*0.04, p[1] + dirLng*0.05 ]);

  const affected = results.filter(r=>r.inFlood);
  const pop = affected.reduce((s,r)=>s+(r.p||0),0);
  const villagesAff = affected.filter(r=>r.t==="settlement").length;
  const floodedArea = Math.PI * Math.pow(radius/1000,2) * 0.62; // km2 approx
  const critCount = affected.filter(r=>["hospital","bridge","road"].includes(r.t) || (r.depth>3) || (r.arrivalMin!==null&&r.arrivalMin<30)).length;
  const riskLevel = critCount>=4 ? "CRITICAL" : critCount>=2 ? "HIGH" : critCount>=1 ? "MODERATE" : (villagesAff>0?"LOW":"MINIMAL");

  return { dam, scenario, sev, radius, head, results, polygon:shifted, affected, pop, villagesAff, floodedArea:+floodedArea.toFixed(1), riskLevel, confidence:sev.conf, maxDist };
}

function riskTier(r){
  if(!r.inFlood) return "none";
  if(["hospital","bridge"].includes(r.t)) return "Critical";
  if(r.t==="road") return "Critical";
  if(r.depth>3 || (r.arrivalMin!==null && r.arrivalMin<30)) return "Critical";
  if(["school"].includes(r.t)) return "Important";
  if(r.depth>1.5 || (r.arrivalMin!==null && r.arrivalMin<60)) return "Important";
  return "Lower";
}

function riskReasons(r){
  const out=[];
  if(r.depth>0) out.push(`Water depth: ${r.depth}m`);
  if(r.arrivalMin!==null) out.push(`Arrival: ${r.arrivalMin<60? r.arrivalMin+" min": Math.floor(r.arrivalMin/60)+"h "+(r.arrivalMin%60)+"m"}`);
  if(r.p>0) out.push(`Population: ${r.p.toLocaleString()}`);
  if(r.t==="hospital") out.push("Hospital within flood zone");
  if(r.t==="bridge") out.push("Bridge within flood zone");
  if(r.t==="school") out.push("School within flood zone");
  if(r.t==="road") out.push("Main road affected");
  if(r.t==="settlement" && r.p>5000) out.push("Dense settlement");
  return out;
}

function confidenceText(sim){
  const c = sim.confidence;
  const factors = ["assumed breach parameters","terrain roughness","simplified flow model","mock elevation grid"];
  return { pct:c, text:`Confidence: ${c}% — based on ${factors.slice(0,2).join(" and ")}` };
}

let currentMap=null, floodLayer=null, villageLayer=null, evacLayer=null;
function rethemeMap(){ if(currentMap){ currentMap.invalidateSize(); } }

function makeMap(containerId, damId, opts={}){
  const dam = DAMS.find(d=>d.id===damId);
  const map = L.map(containerId).setView([dam.lat,dam.lng], 10);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap", maxZoom:18}).addTo(map);
  const damIcon = L.divIcon({html:`<div style="width:26px;height:26px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:bold;">D</div>`,className:"",iconSize:[26,26]});
  L.marker([dam.lat,dam.lng],{icon:damIcon}).addTo(map).bindPopup(`<b>${dam.name}</b><br/>${dam.river}, ${dam.state}`);
  return map;
}

function drawFlood(map, sim){
  if(floodLayer) map.removeLayer(floodLayer);
  floodLayer = L.polygon(sim.polygon,{color: getCss("--flood"),weight:2,fillColor:getCss("--flood"),fillOpacity:0.28}).addTo(map);
  map.fitBounds(floodLayer.getBounds(),{padding:[40,40]});
}
function drawVillages(map, sim){
  if(villageLayer) map.removeLayer(villageLayer);
  villageLayer = L.layerGroup().addTo(map);
  sim.results.forEach(v=>{
    if(v.t==="safezone") return;
    const tier = riskTier(v);
    const col = tier==="Critical"?getCss("--risk-crit"):tier==="Important"?getCss("--risk-imp"):tier==="Lower"?getCss("--risk-low"):getCss("--muted");
    const icon = {hospital:"🏥",bridge:"🌉",school:"🏫",road:"🛣️",settlement:"📍"}[v.t]||"📍";
    const m = L.divIcon({html:`<div style="width:24px;height:24px;border-radius:50%;background:${col};border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:11px;">${icon}</div>`,className:"",iconSize:[24,24]});
    const popup = v.inFlood ? `<b>${v.n}</b><br/>Risk: ${tier}<br/>Depth: ${v.depth}m<br/>Arrival: ${v.arrivalMin===null?"—":(v.arrivalMin<60?v.arrivalMin+" min":Math.floor(v.arrivalMin/60)+"h "+(v.arrivalMin%60)+"m")}` : `<b>${v.n}</b><br/>Outside flood zone`;
    L.marker([v.lat,v.lng],{icon:m}).bindPopup(popup).addTo(villageLayer);
  });
}
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

        </div>

function setSev(sv){ state.scenario.severity=sv; document.querySelectorAll("#sevSeg button").forEach(b=>b.classList.toggle("active",b.dataset.sv===sv)); }
function setDur(d){ state.scenario.duration=d; document.querySelectorAll("#durSeg button").forEach(b=>b.classList.toggle("active",+b.dataset.d===d)); document.getElementById("dLabel").textContent=d+"h"; }
function runSim(){
  state.scenario.damId = document.getElementById("simDam").value;
  state.scenario.width = +document.getElementById("simWidth").value;
  state.scenario.head = +document.getElementById("simHead").value;
  const status=document.getElementById("simStatus");
  status.textContent="Simulating flood spread…";
  setTimeout(()=>{
    const sim = runSimulation(state.scenario.damId, state.scenario);
    state.currentSim = sim;
    if(currentMap){ currentMap.remove(); currentMap=null; }
    currentMap = makeMap("simMap", state.scenario.damId);
    drawFlood(currentMap, sim);
    drawVillages(currentMap, sim);
    document.getElementById("simSummary").innerHTML = [
      ["Villages",sim.villagesAff],["Population",sim.pop.toLocaleString()],["Area",sim.floodedArea+" km²"],["Risk",sim.riskLevel]

    status.innerHTML = `✓ Simulation complete — <span class="text-accent">${confidenceText(sim).text}</span>`;

  }, 650);
}

/* =================== PAGE: EVAC =================== */
function pageEvac(){
  const sim = state.currentSim || runSimulation(state.scenario.damId, state.scenario);
  state.currentSim = sim;
  const atRisk = sim.results.filter(r=>r.inFlood && r.t==="settlement");
  const safe = sim.results.filter(r=>r.t==="safezone");
  return `
  <div class="fade-up">
    <div class="flex items-center gap-3 mb-5">
      <img src="${LOGO}" class="logo-mark" style="width:36px;height:36px;object-fit:contain;" alt="HTF"/>
      <h1 class="font-head text-2xl">Intelligent Evacuation Routing</h1>
    </div>
    <div class="grid lg:grid-cols-3 gap-5">
      <div class="lg:col-span-2 card p-3"><div id="evacMap" style="height:480px;border-radius:14px;"></div></div>
      <div class="card p-5">
        <h3 class="font-head text-lg mb-3">Suggested routes</h3>
        <div class="space-y-3 overflow-auto scrollbar max-h-[440px]">
          ${atRisk.map(v=>{
            const target = safe.reduce((best,s)=>{ const d=haversine({lat:v.lat,lng:v.lng},{lat:s.lat,lng:s.lng}); return (!best||d<best.d)?{s,d}:best; },null);
            const distKm=(target.d/1000).toFixed(1);
            const walkH=Math.round(target.d/80); // 80m/min walking
            return `<div class="card-2 p-3">
              <div class="flex justify-between"><b>${v.n}</b><span class="chip px-2 py-0.5 rounded text-xs">→ ${target.s.n}</span></div>
              <p class="text-muted text-xs mt-1">Distance ${distKm} km · est. ${walkH<60?walkH+" min":Math.floor(walkH/60)+"h "+(walkH%60)+"m"} on foot · route avoids flood segments</p>
            </div>`;
          }).join("")}
        </div>
      </div>
    </div>
  </div>`;
}
function initEvac(){
  currentMap = makeMap("evacMap", state.scenario.damId);
  const sim = state.currentSim || runSimulation(state.scenario.damId, state.scenario);
  drawFlood(currentMap, sim);
  // draw villages + safe zones + routes
  if(evacLayer) currentMap.removeLayer(evacLayer);
  evacLayer = L.layerGroup().addTo(currentMap);
  sim.results.forEach(v=>{
    if(v.t==="safezone"){
      const ic=L.divIcon({html:`<div style="width:28px;height:28px;border-radius:50%;background:${getCss("--safe")};border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:12px;">✓</div>`,className:"",iconSize:[28,28]});
      L.marker([v.lat,v.lng],{icon:ic}).bindPopup(`<b>Safe Zone</b><br/>${v.n}`).addTo(evacLayer);
    } else if(v.inFlood && v.t==="settlement"){
      const ic=L.divIcon({html:`<div style="width:22px;height:22px;border-radius:50%;background:${getCss("--risk-crit")};border:2px solid #fff;"></div>`,className:"",iconSize:[22,22]});
      L.marker([v.lat,v.lng],{icon:ic}).bindPopup(`<b>At risk</b><br/>${v.n}`).addTo(evacLayer);
    }
  });
  // routes (bend around flood centroid)
  const atRisk = sim.results.filter(r=>r.inFlood && r.t==="settlement");
  const safe = sim.results.filter(r=>r.t==="safezone");
  atRisk.forEach(v=>{
    const target = safe.reduce((best,s)=>{ const d=haversine({lat:v.lat,lng:v.lng},{lat:s.lat,lng:s.lng}); return (!best||d<best.d)?{s,d}:best; },null);
    // midpoint offset to bend around flood
    const midLat=(v.lat+target.s.lat)/2, midLng=(v.lng+target.s.lng)/2;
    const offLat = midLat + (midLat - sim.dam.lat)*0.0008;
    const offLng = midLng + (midLng - sim.dam.lng)*0.0008;
    L.polyline([[v.lat,v.lng],[offLat,offLng],[target.s.lat,target.s.lng]],{color:getCss("--safe"),weight:3,dashArray:"6 8"}).addTo(evacLayer);
  });
}

function toast(msg){
  let t=document.getElementById("htfToast");
  if(!t){ t=document.createElement("div"); t.id="htfToast"; t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:9998;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;transition:opacity .3s"; if(getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()==="#8FE0A8") t.style.color="#0C1410"; document.body.appendChild(t); }

  clearTimeout(t._h); t._h=setTimeout(()=>t.style.opacity="0",2600);
}

boot();
